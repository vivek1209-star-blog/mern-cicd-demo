# =========================================================
#  Kubernetes manifest — backend + frontend
#  DOCKERHUB_USER aur IMAGE_TAG ko pipeline (sed) replace karti hai.
#  Local test (minikube/Docker Desktop):
#     sed "s|DOCKERHUB_USER|yourname|g; s|IMAGE_TAG|latest|g" k8s/app.yaml | kubectl apply -f -
# =========================================================

# ---------- Backend Deployment: "3 copies chalao, mar jaye to naya banao" ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 3
  selector:
    matchLabels: { app: backend }
  strategy:
    type: RollingUpdate # ek-ek karke purane pod hatao, naye lagao => zero downtime
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: DOCKERHUB_USER/cicd-demo-backend:IMAGE_TAG
          ports: [{ containerPort: 5000 }]
          env:
            - { name: APP_VERSION, value: "IMAGE_TAG" }
          readinessProbe: # traffic tabhi bhejo jab app ready ho
            httpGet: { path: /api/health, port: 5000 }
            initialDelaySeconds: 3
          livenessProbe: # app hang ho gaya to restart karo
            httpGet: { path: /api/health, port: 5000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
# ---------- Backend Service: pods ka ek fixed naam/address ----------
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app: backend }
  ports: [{ port: 5000, targetPort: 5000 }]
---
# ---------- Frontend Deployment ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: DOCKERHUB_USER/cicd-demo-frontend:IMAGE_TAG
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
# ---------- Frontend Service: bahar ki duniya se access ----------
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer # cloud pe public IP milega; minikube me: minikube service frontend
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]
